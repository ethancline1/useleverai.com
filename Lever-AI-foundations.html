<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeverAI: Foundations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:             #0d0d14;
      --surface:        #14141f;
      --surface-2:      #1c1c2b;
      --border:         #252538;
      --border-2:       #32324a;
      --text:           #eeeef8;
      --text-muted:     #8888aa;
      --text-subtle:    #52527a;
      --accent:         #e53935;
      --accent-dark:    #c62828;
      --accent-hover:   #ff5252;
      --accent-light:   rgba(229,57,53,0.13);
      --accent-light-2: rgba(229,57,53,0.28);
      --gradient:       linear-gradient(135deg, #e53935 0%, #ff6b35 100%);
      --glow:           0 0 24px rgba(229,57,53,0.25);
      --shadow:         0 2px 8px rgba(0,0,0,0.5);
      --shadow-md:      0 6px 24px rgba(0,0,0,0.6);
      --success:        #22c55e;
      --success-dark:   #16a34a;
      --success-light:  rgba(34,197,94,0.12);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    .topbar {
      height: 60px;
      background: rgba(13,13,20,0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 0 var(--border), 0 4px 20px rgba(0,0,0,0.4);
    }

    .topbar-logo {
      font-size: 1.05rem;
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      cursor: pointer;
      white-space: nowrap;
      filter: drop-shadow(0 0 8px rgba(229,57,53,0.4));
    }

    .topbar-divider { width: 1px; height: 24px; background: var(--border-2); flex-shrink: 0; }

    .topbar-subtitle { font-size: 0.82rem; color: var(--text-subtle); white-space: nowrap; }

    .topbar-free-badge {
      margin-left: auto;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--success);
      background: var(--success-light);
      border: 1px solid rgba(34,197,94,0.3);
      padding: 3px 10px;
      border-radius: 9999px;
    }

    .hamburger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.3rem;
      margin-left: auto;
      padding: 4px;
    }

    .body-layout { display: flex; flex: 1; }

    /* ── Sidebar ── */
    .sidebar {
      width: 240px;
      min-width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      height: calc(100vh - 60px);
      position: sticky;
      top: 60px;
      overflow-y: auto;
      padding: 8px 0 24px;
      flex-shrink: 0;
    }

    .sidebar-progress {
      padding: 14px 16px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 6px;
    }
    .sidebar-progress-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .sidebar-progress-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
    }
    .sidebar-progress-count {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
      transition: color 0.3s;
    }
    .sidebar-progress-count.all-done { color: var(--success); }
    .sidebar-progress-track {
      height: 5px;
      background: var(--border);
      border-radius: 9999px;
      overflow: hidden;
    }
    .sidebar-progress-fill {
      height: 100%;
      width: 0%;
      background: var(--gradient);
      border-radius: 9999px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }

    .nav-section-label {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-subtle);
      padding: 16px 16px 6px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      font-size: 0.83rem;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 8px;
      transition: all 0.15s;
      position: relative;
    }
    .nav-item:hover { background: var(--surface-2); color: var(--text); }
    .nav-item.active {
      background: var(--accent-light);
      color: var(--accent);
      font-weight: 600;
    }
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0; top: 20%; bottom: 20%;
      width: 3px;
      background: var(--gradient);
      border-radius: 0 2px 2px 0;
      margin-left: -8px;
    }

    .nav-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border-2);
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--text-subtle);
      flex-shrink: 0;
      transition: all 0.2s;
      position: relative;
    }
    .nav-item.active .nav-num {
      background: var(--accent-light);
      border-color: var(--accent-light-2);
      color: var(--accent);
    }

    /* Completed nav item */
    .nav-item.completed .nav-num {
      background: var(--success);
      border-color: var(--success);
      color: transparent;
      font-size: 0;
    }
    .nav-item.completed .nav-num::after {
      content: '✓';
      font-size: 0.72rem;
      color: white;
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-badge {
      margin-left: auto;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 9999px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-free {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.25);
    }
    .badge-ref {
      background: var(--surface-2);
      color: var(--text-subtle);
      border: 1px solid var(--border-2);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      padding: 48px 56px;
      max-width: 860px;
      width: 100%;
    }

    /* ── Hero ── */
    .hero {
      text-align: center;
      padding: 32px 0 48px;
    }
    .hero-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      background: var(--accent-light);
      border: 1px solid var(--accent-light-2);
      color: var(--accent);
      padding: 6px 16px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    .hero h1 span {
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 20px rgba(229,57,53,0.3));
    }
    .hero-sub {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 580px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }
    .hero-cta { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--gradient);
      color: white;
      box-shadow: var(--glow);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 0 32px rgba(229,57,53,0.4); }
    .btn-ghost {
      background: var(--surface-2);
      color: var(--text-muted);
      border: 1px solid var(--border-2);
    }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-lg { padding: 13px 28px; font-size: 0.95rem; }
    .btn-success {
      background: var(--success);
      color: white;
    }
    .btn-success:hover { background: var(--success-dark); transform: translateY(-1px); }

    /* ── Typography ── */
    h1 { font-size: 2.1rem; font-weight: 800; line-height: 1.15; margin-bottom: 12px; letter-spacing: -0.02em; }
    h2 { font-size: 1.35rem; font-weight: 700; margin: 36px 0 12px; letter-spacing: -0.01em; }
    h3 { font-size: 1.05rem; font-weight: 700; margin: 24px 0 8px; }
    p { color: var(--text-muted); margin-bottom: 14px; font-size: 0.93rem; }
    ul, ol { padding-left: 20px; color: var(--text-muted); font-size: 0.93rem; }
    li { margin-bottom: 6px; }
    strong { color: var(--text); font-weight: 600; }
    code { font-family: 'JetBrains Mono', monospace; font-size: 0.82em; background: var(--surface-2); padding: 2px 6px; border-radius: 4px; color: var(--accent); border: 1px solid var(--border); }
    hr.divider { border: none; border-top: 1px solid var(--border); margin: 36px 0; }

    .page-subtitle {
      font-size: 1.05rem;
      color: var(--text-muted);
      margin-bottom: 32px;
      line-height: 1.7;
    }
    .session-eyebrow {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .phase-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 9999px;
      margin-bottom: 16px;
    }
    .phase-badge-free {
      background: var(--success-light);
      color: var(--success);
      border: 1px solid rgba(34,197,94,0.25);
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-2); }
    .card h3 { margin-top: 0; color: var(--text); }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      margin: 20px 0;
    }

    /* ── Callouts ── */
    .callout {
      display: flex;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 10px;
      margin: 20px 0;
      border: 1px solid transparent;
      font-size: 0.88rem;
    }
    .callout-icon { font-size: 1.2rem; flex-shrink: 0; line-height: 1.4; }
    .callout-label { font-weight: 700; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
    .callout-content { color: var(--text-muted); line-height: 1.6; }
    .callout-key  { background: var(--accent-light);  border-color: var(--accent-light-2); }
    .callout-key .callout-label  { color: var(--accent); }
    .callout-tip  { background: var(--success-light); border-color: rgba(34,197,94,0.25); }
    .callout-tip .callout-label  { color: var(--success); }
    .callout-info { background: rgba(96,165,250,0.08); border-color: rgba(96,165,250,0.2); }
    .callout-info .callout-label { color: #60a5fa; }
    .callout-warn { background: rgba(251,191,36,0.08); border-color: rgba(251,191,36,0.2); }
    .callout-warn .callout-label { color: #fbbf24; }

    /* ── Code Blocks ── */
    .code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin: 14px 0;
    }
    .code-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
    }
    .code-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-subtle); }
    .code-content {
      padding: 16px 18px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }
    .copy-btn {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 5px;
      border: 1px solid var(--border-2);
      background: var(--surface);
      color: var(--text-subtle);
      cursor: pointer;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--success); color: var(--success); }

    /* ── Tabs ── */
    .tabs-wrap { margin: 20px 0; }
    .tab-bar {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 0;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 8px 16px;
      font-size: 0.82rem;
      font-weight: 600;
      background: none;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text-muted); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; padding: 20px 0; }
    .tab-panel.active { display: block; }

    /* ── Steps ── */
    .steps { list-style: none; padding: 0; counter-reset: step; }
    .steps li {
      counter-increment: step;
      display: flex;
      gap: 16px;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
    }
    .steps li:last-child { border-bottom: none; }
    .steps li::before {
      content: counter(step);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--gradient);
      color: white;
      font-weight: 700;
      font-size: 0.82rem;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .step-title { font-weight: 700; font-size: 0.95rem; color: var(--text); margin-bottom: 4px; }
    .step-desc  { font-size: 0.88rem; color: var(--text-muted); }

    /* ── Objectives ── */
    .objectives {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      padding: 16px 20px;
      margin: 20px 0 28px;
    }
    .objectives-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .objectives ul { padding-left: 16px; margin: 0; }
    .objectives li { margin-bottom: 4px; font-size: 0.88rem; color: var(--text-muted); }

    /* ── Next Bar ── */
    .next-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-top: 40px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .next-bar:hover { border-color: var(--accent); box-shadow: var(--glow); }
    .next-bar-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-subtle); margin-bottom: 4px; }
    .next-bar-title { font-size: 1rem; font-weight: 700; color: var(--text); }
    .next-bar-arrow { font-size: 1.4rem; color: var(--accent); }

    /* ── Complete Bar ── */
    .complete-bar {
      margin: 36px 0 0;
      padding: 18px 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      transition: border-color 0.25s, background 0.25s;
    }
    .complete-bar.done { border-color: var(--success); background: var(--success-light); }
    .complete-bar-left { display: flex; align-items: center; gap: 14px; }
    .complete-bar-icon {
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 2px solid var(--border-2);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
      color: var(--text-subtle);
      transition: all 0.25s;
    }
    .complete-bar.done .complete-bar-icon { background: var(--success); border-color: var(--success); color: white; font-size: 0.95rem; }
    .complete-bar-text { font-size: 0.9rem; font-weight: 600; color: var(--text); transition: color 0.25s; }
    .complete-bar.done .complete-bar-text { color: var(--success); }
    .complete-bar-sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }
    .complete-btn-primary {
      padding: 9px 20px; border-radius: 8px;
      font-size: 0.83rem; font-weight: 600;
      cursor: pointer; border: 1px solid var(--border-2);
      background: var(--surface-2); color: var(--text);
      white-space: nowrap; transition: all 0.2s; flex-shrink: 0;
    }
    .complete-btn-primary:hover { border-color: var(--success); color: var(--success); background: var(--success-light); }
    .complete-btn-undo {
      background: transparent; border: none;
      color: var(--text-subtle); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; padding: 4px 8px; border-radius: 4px;
      white-space: nowrap; flex-shrink: 0; transition: color 0.2s;
    }
    .complete-btn-undo:hover { color: var(--text-muted); }

    /* ── CTA Card ── */
    .cta-card {
      background: linear-gradient(135deg, rgba(229,57,53,0.12) 0%, rgba(255,107,53,0.08) 100%);
      border: 1px solid var(--accent-light-2);
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      margin: 40px 0;
    }
    .cta-card h2 { margin-top: 0; color: var(--text); font-size: 1.4rem; }
    .cta-card p  { color: var(--text-muted); margin-bottom: 20px; }

    /* ── Feature Table ── */
    .feature-table { width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 0.87rem; }
    .feature-table th {
      text-align: left;
      padding: 10px 14px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-subtle);
      border-bottom: 1px solid var(--border);
      background: var(--surface-2);
    }
    .feature-table td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-muted);
      vertical-align: top;
    }
    .feature-table tr:last-child td { border-bottom: none; }
    .feature-table tr:nth-child(even) td { background: rgba(255,255,255,0.01); }
    .feature-table td:first-child { font-weight: 700; color: var(--text); white-space: nowrap; }

    /* ── Lesson card on home ── */
    .lesson-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lesson-card:hover { border-color: var(--accent-light-2); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .lesson-num {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 8px;
    }
    .lesson-card h3 { margin: 0 0 6px; font-size: 0.98rem; color: var(--text); }
    .lesson-card p  { margin: 0; font-size: 0.82rem; color: var(--text-muted); line-height: 1.5; }
    .lessons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }

    /* ── Responsive ── */
    @media (max-width: 820px) {
      .sidebar {
        display: none;
        position: fixed;
        top: 60px; left: 0;
        z-index: 90;
        height: calc(100vh - 60px);
        box-shadow: var(--shadow-md);
      }
      .sidebar.open { display: block; }
      .hamburger { display: block; }
      .topbar-free-badge { display: none; }
      .main { padding: 28px 20px; }
      .hero h1 { font-size: 2rem; }

<div class="phase-badge phase-badge-free">Foundations — Free</div>
<h1>The 5 Mental Models</h1>
<p class="page-subtitle">Features and setup get you started. Mental models are what separate people who get extraordinary results from people who get mediocre ones. These five thinking frameworks are the actual skill.</p>

<div class="objectives">
  <div class="objectives-label">What you'll learn</div>

<h2>Mental Model 01 — Give Claude Data. Ask Claude to Think.</h2>
<p>This is the foundation. Everything else in this course builds on it. Claude doesn't look things up — it reasons over what you give it. When you hand it real source material, it becomes extraordinary. When you ask it to recall things from memory, it can confidently produce wrong answers.</p>

<div class="card-grid" style="grid-template-columns:1fr 1fr;margin:16px 0">

  </div>
</div>

<hr class="divider" />

<h2>Mental Model 02 — Context Is Everything. More Structure = Better Output.</h2>
<p>A vague prompt gets a generic answer. A structured prompt with a specific role, clear task, real data, and defined output format gets a consulting-quality deliverable. The prompt is the product. This is the skill worth developing.</p>

<div class="card-grid" style="grid-template-columns:1fr 1fr;margin:16px 0">
  <div class="card" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#ef4444;margin-bottom:8px">❌ Don't do this</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">"Analyze this company."</p>

  </div>
  <div class="card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--success);margin-bottom:8px">✓ Do this instead</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">"You are a senior strategy consultant. I am evaluating this company as a potential acquisition target. Here is their 10-K [paste]. Give me the 3 biggest risks and 3 biggest opportunities. Format: executive brief with bullet points, under 400 words."</p>
    <p style="margin:8px 0 0;font-size:0.78rem;color:var(--text-subtle)">Role + context + data + format = a deliverable worth actually using.</p>

  </div>
</div>

<hr class="divider" />

<h2>Mental Model 03 — Always Run the Adversarial Review.</h2>
<p>Claude's first answer is a first draft. It's good — often very good — but it's one-pass thinking. The adversarial review is a second pass where you ask Claude to attack its own output. This is where the real insight comes from: the cracks it finds in its own reasoning are almost always the most valuable part of the analysis.</p>

<div class="card-grid" style="grid-template-columns:1fr 1fr;margin:16px 0">
  <div class="card" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#ef4444;margin-bottom:8px">❌ Don't do this</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Accept Claude's first analysis as final and act on it.</p>
    <p style="margin:8px 0 0;font-size:0.78rem;color:var(--text-subtle)">First-pass thinking misses edge cases, hidden assumptions, and the strongest counterarguments.</p>
  </div>
  <div class="card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--success);margin-bottom:8px">✓ Do this instead</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">After any important analysis: "Now switch roles. You are a skeptical expert reviewing this. Attack it — where is the logic weakest? What assumption, if wrong, destroys this conclusion? What is this analysis missing?"</p>
    <p style="margin:8px 0 0;font-size:0.78rem;color:var(--text-subtle)">Two-pass thinking is categorically better than one-pass. This is the move.</p>
  </div>
</div>

  </div>
</div>

<hr class="divider" />

<h2>Mental Model 04 — Fresh Conversations for New Topics. Projects for Ongoing Work.</h2>
<p>Long conversations degrade. As a thread gets longer, Claude starts to lose context from early in the conversation, response quality drops, and it begins to agree with you rather than reason independently. The fix is simple: keep conversations short and focused, and use Projects to inject permanent context without polluting the thread.</p>

<div class="card-grid" style="grid-template-columns:1fr 1fr;margin:16px 0">
  <div class="card" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:#ef4444;margin-bottom:8px">❌ Don't do this</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Keep one massive conversation going for days, jumping between topics, re-explaining context over and over.</p>
    <p style="margin:8px 0 0;font-size:0.78rem;color:var(--text-subtle)">Output quality quietly degrades as the conversation grows. You might not notice until the answers start feeling off.</p>
  </div>
  <div class="card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.05)">
    <div style="font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--success);margin-bottom:8px">✓ Do this instead</div>
    <p style="margin:0;font-size:0.85rem;color:var(--text-muted)">Start a new chat for each distinct task. Use a Project for ongoing work — your standing context loads fresh at the start of every conversation in it, no re-explaining required.</p>
    <p style="margin:8px 0 0;font-size:0.78rem;color:var(--text-subtle)">Short, focused conversations + Projects for permanent context = consistently sharp output.</p>
  </div>
</div>

<div class="callout callout-key">
  <div class="callout-icon">🎯</div>
  <div>
    <div class="callout-label">The rule</div>
    <div class="callout-content">Think of conversations as disposable — use them for one task, then start fresh. Projects are permanent — they hold your standing context and reload it every time. Never re-explain who you are or what you're working on. That's what Projects are for.</div>
  </div>
</div>

<hr class="divider" />

<h2>Mental Model 05 — Don't Prompt. Architect.</h2>
<p>There are two kinds of Claude users. The first uses Claude to complete individual tasks — write this email, summarize this document, answer this question. They save time. The second designs systems — reusable templates, chained workflows, automated pipelines that run on a schedule. They create new capabilities. This course teaches you to be the second kind.</p>

<div class="card-grid" style="grid-template-columns:1fr 1fr;margin:16px 0">
  <div class="card" style="border-color:rgba(239,68,68,0.3);background:rgba(239,68,68,0.05)">

  <div class="card" style="border-color:rgba(34,197,94,0.3);background:rgba(34,197,94,0.05)">

<div class="session-eyebrow">Lesson 05</div>
<div class="phase-badge phase-badge-free">Foundations — Free</div>
<h1>Prompts That Work</h1>
<p class="page-subtitle">Knowing the principles is one thing. Having the actual prompts ready to paste is another. These three templates cover the vast majority of what you'll ever need Claude to do — and they're all built on the mental models from Lesson 4.</p>

<div class="objectives">
  <div class="objectives-label">What you'll learn</div>
  <ul>
    <li>Three universal prompt templates you can use for almost any task</li>
    <li>When and why to reach for each one</li>
    <li>How to customize each template for your specific situation</li>
  </ul>
</div>

<div class="callout callout-info">
  <div class="callout-icon">ℹ️</div>
  <div>
    <div class="callout-label">How to use these</div>
    <div class="callout-content">Each prompt has a Copy button. Paste it into Claude, fill in the brackets with your real information, and go. These are starting points — the more specifically you fill them in, the better the output you'll get back.</div>
  </div>
</div>

<h2>Prompt 1 — The Universal Opener</h2>
<p>Use this on any analytical, research, or writing task. The four elements — role, context, data, format — are the same four things that make every great prompt work. This template forces you to include all of them.</p>
<p><strong>When to use it:</strong> Any time you're asking Claude to analyze something, write something substantial, or produce a deliverable you'll actually use. This is your default prompt structure for serious work.</p>

<div class="code-block">
  <div class="code-header"><span class="code-label">Universal Opener</span><button class="copy-btn">Copy</button></div>
  <div class="code-content">You are a [specific expert role — e.g., "senior financial analyst," "experienced copywriter," "strategic consultant"].

I am a [your role/background — e.g., "marketing manager," "freelance designer," "first-year finance student"] working toward [your goal — e.g., "pitching this client next week," "building my portfolio," "passing this exam"].

Here is the data/information you need:
[paste your document, spreadsheet data, notes, or relevant context here]

Your task: [exactly what you want Claude to do — be specific]

Format your response as:
- [Section or output type 1]
- [Section or output type 2]
- [Section or output type 3]

Constraints: Keep it under [X] words. Flag any estimates as [ESTIMATE] and any assumptions as [ASSUMPTION]. End with the 3 things I should verify before acting on this.</div>
</div>

<div class="callout callout-key">
  <div class="callout-icon">💡</div>
  <div>
    <div class="callout-label">What makes this work</div>
    <div class="callout-content">The role tells Claude how to think. The context tells Claude who it's talking to. The data gives it something real to reason about. The format tells it exactly what to produce. All four together = a prompt that gets results the first time instead of requiring five rounds of back-and-forth.</div>
  </div>
</div>

<hr class="divider" />

<h2>Prompt 2 — The Adversarial Review</h2>
<p>Run this immediately after Claude gives you any important analysis, plan, or piece of writing. It asks Claude to switch roles and attack its own output — and the cracks it finds in its own reasoning are almost always the most valuable part of the whole exchange.</p>
<p><strong>When to use it:</strong> After any analysis you plan to act on. After a business plan, a strategic recommendation, a piece of writing that will be seen publicly, a proposal before you send it. Anything where being wrong is costly — run the adversarial review first.</p>

<div class="code-block">
  <div class="code-header"><span class="code-label">Adversarial Review</span><button class="copy-btn">Copy</button></div>
  <div class="code-content">Now switch roles. You are a skeptical senior expert reviewing this analysis.

Attack it:
1. Where is the logic weakest?
2. What assumption, if wrong, destroys this conclusion entirely?
3. What would make a smart, experienced person immediately dismiss this?
4. What critical information are we missing that would change the recommendation?

Be direct. Don't defend the previous answer — challenge it. Give me the strongest case that the analysis above is wrong.</div>
</div>

<div class="callout callout-key">
  <div class="callout-icon">💡</div>
  <div>
    <div class="callout-label">Why this works so well</div>
    <div class="callout-content">Claude's first answer is optimized to be helpful and agreeable. The adversarial review forces it out of that mode. The "skeptical senior expert who rejects 80% of analyses" framing is specific enough that Claude actually takes a harder stance — not just a softened version of its original answer.</div>
  </div>
</div>

<hr class="divider" />

<h2>Prompt 3 — The Screenshot Rescue</h2>
<p>You already saw this in Lesson 2. It's here again because it's that useful. Any time you're stuck on an interface, an error message, a confusing setting, or something in this course that isn't making sense — take a screenshot, open Claude, upload it, paste this prompt.</p>
<p><strong>When to use it:</strong> Whenever you're stuck. Full stop. GitHub settings, Zapier workflows, terminal errors, Claude interface confusion — this prompt handles all of it and is consistently better than Googling the problem.</p>

<div class="code-block">
  <div class="code-header"><span class="code-label">Screenshot Rescue</span><button class="copy-btn">Copy</button></div>
  <div class="code-content">I'm working through an AI learning guide and I've attached a screenshot of something I don't understand.

Please:
1. Tell me exactly what I'm looking at in plain English
2. Explain what I'm supposed to do here — assume I have zero prior experience with this
3. Walk me through the next 3 steps, naming every button to click

// ─────────────────────────────────────────────
//  ROUTER
// ─────────────────────────────────────────────

function navigate(page) {
  const content = document.getElementById('content');
  const html = pages[page];
  if (!html) return;
  content.innerHTML = html;
  content.scrollTop = 0;
  window.scrollTo(0, 0);
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.page === page);
  });
  document.getElementById('sidebar').classList.remove('open');
  wireCopyButtons();
  wireTabButtons();
  wireCompleteButtons();
  updateNavProgress();
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

// ── Copy buttons ──
function wireCopyButtons() {
  document.querySelectorAll('.copy-btn').forEach(btn => {
    btn.onclick = function() {
      const block = this.closest('.code-block');
      const text = block ? block.querySelector('.code-content').innerText : '';
      navigator.clipboard.writeText(text).then(() => {
        this.textContent = '✓ Copied';
        this.classList.add('copied');
        setTimeout(() => { this.textContent = 'Copy'; this.classList.remove('copied'); }, 2000);
      });
    };
  });
}

// ── Tab buttons ──
function wireTabButtons() {
  document.querySelectorAll('.tabs-wrap').forEach(wrap => {
    wrap.querySelectorAll('.tab-btn').forEach(btn => {
      btn.onclick = function() {
        wrap.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        wrap.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
        const target = wrap.querySelector(`.tab-panel[data-tab="${this.dataset.tab}"]`);
        if (target) target.classList.add('active');
      };
    });
  });
}

// ── Session Progress (wired fully in Prompt 4) ──
const SESSION_IDS = ['l1','l2','l3','l4','l5'];
const PROGRESS_KEY = 'leverai_foundations_progress';

function getProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY) || '{}'); }
  catch(e) { return {}; }
}

function toggleComplete(sessionId) {
  const progress = getProgress();
  progress[sessionId] = !progress[sessionId];
  localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress));
  renderCompleteBar(sessionId, progress[sessionId]);
  updateNavProgress();
}

function renderCompleteBar(sessionId, isDone) {
  const wrap = document.querySelector(`.session-complete-wrap[data-session="${sessionId}"]`);
  if (!wrap) return;
  const num = sessionId.replace('l', '');
  if (isDone) {
    wrap.innerHTML = `
      <div class="complete-bar done">
        <div class="complete-bar-left">
          <div class="complete-bar-icon">✓</div>
          <div>
            <div class="complete-bar-text">Lesson ${num} Complete</div>
            <div class="complete-bar-sub">Nicely done. Keep the momentum going.</div>
          </div>
        </div>
        <button class="complete-btn-undo" onclick="toggleComplete('${sessionId}')">Undo</button>
      </div>`;
  } else {
    wrap.innerHTML = `
      <div class="complete-bar">
        <div class="complete-bar-left">
          <div class="complete-bar-icon">○</div>
          <div>
            <div class="complete-bar-text">Mark Lesson ${num} Complete</div>
            <div class="complete-bar-sub">Check it off once you've finished the lesson and tried the prompts.</div>
          </div>
        </div>
        <button class="complete-btn-primary" onclick="toggleComplete('${sessionId}')">Mark Complete</button>
      </div>`;
  }
}

function wireCompleteButtons() {
  const progress = getProgress();
  document.querySelectorAll('.session-complete-wrap[data-session]').forEach(wrap => {
    renderCompleteBar(wrap.dataset.session, !!progress[wrap.dataset.session]);
  });
}

function updateNavProgress() {
  const progress = getProgress();
  const doneCount = SESSION_IDS.filter(id => progress[id]).length;
  SESSION_IDS.forEach(id => {
    const el = document.querySelector(`.nav-item[data-page="${id}"]`);
    if (el) el.classList.toggle('completed', !!progress[id]);
  });
  const countEl = document.getElementById('prog-count');
  const fillEl  = document.getElementById('prog-fill');
  if (countEl) {
    countEl.textContent = `${doneCount} / 5`;
    countEl.classList.toggle('all-done', doneCount === 5);
  }
  if (fillEl) fillEl.style.width = `${(doneCount / 5) * 100}%`;
}

// ── Init ──
navigate('home');
updateNavProgress();
